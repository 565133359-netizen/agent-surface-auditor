<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Agent Surface Auditor</title>
  <desc id="desc">A shield and scanning grid representing read-only static analysis for agentic repositories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1b33"/>
      <stop offset="1" stop-color="#15143a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62e6ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5ee7ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8aa4d8" stroke-opacity="0.09"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="225" cy="210" r="170" fill="url(#glow)"/>
  <circle cx="1080" cy="58" r="130" fill="#8b5cf6" opacity="0.08" filter="url(#soft)"/>

  <g transform="translate(102 78)">
    <path d="M122 2 226 42v79c0 72-42 135-104 164C60 256 18 193 18 121V42Z" fill="#0b1629" stroke="url(#accent)" stroke-width="5"/>
    <path d="M122 34 194 61v59c0 50-27 95-72 121-45-26-72-71-72-121V61Z" fill="#10223e" stroke="#77dff3" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M82 91h80M70 122h104M82 153h80" stroke="#70e1f4" stroke-width="8" stroke-linecap="round"/>
    <circle cx="61" cy="91" r="5" fill="#a78bfa"/>
    <circle cx="183" cy="122" r="5" fill="#a78bfa"/>
    <circle cx="61" cy="153" r="5" fill="#a78bfa"/>
    <path d="m94 190 21 21 39-48" fill="none" stroke="#a78bfa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="400" y="92" fill="#71e4f7" font-size="17" font-weight="700" letter-spacing="3">READ-ONLY STATIC ANALYSIS</text>
    <text x="400" y="162" fill="#f7fbff" font-size="55" font-weight="760">Agent Surface Auditor</text>
    <text x="400" y="209" fill="#b7c5df" font-size="24">Map the executable surface before an agent runs.</text>

    <g transform="translate(400 260)" font-size="16" font-weight="650" text-anchor="middle">
      <g><rect width="116" height="42" rx="21" fill="#132c48" stroke="#4dcde5" stroke-opacity="0.45"/><text x="58" y="27" fill="#d9f8ff">AI Agents</text></g>
      <g transform="translate(130)"><rect width="92" height="42" rx="21" fill="#211d47" stroke="#9b87f5" stroke-opacity="0.5"/><text x="46" y="27" fill="#ebe7ff">Skills</text></g>
      <g transform="translate(236)"><rect width="100" height="42" rx="21" fill="#132c48" stroke="#4dcde5" stroke-opacity="0.45"/><text x="50" y="27" fill="#d9f8ff">Plugins</text></g>
      <g transform="translate(350)"><rect width="82" height="42" rx="21" fill="#211d47" stroke="#9b87f5" stroke-opacity="0.5"/><text x="41" y="27" fill="#ebe7ff">MCP</text></g>
      <g transform="translate(446)"><rect width="130" height="42" rx="21" fill="#132c48" stroke="#4dcde5" stroke-opacity="0.45"/><text x="65" y="27" fill="#d9f8ff">Automation</text></g>
    </g>

    <text x="400" y="354" fill="#8ea2c5" font-size="16" letter-spacing="1.2">SHELL · FILESYSTEM · NETWORK · CREDENTIALS · PROMPTS · SUPPLY CHAIN</text>
  </g>
</svg>
